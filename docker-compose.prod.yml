services:

  payment_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: payment_service
      POSTGRES_MAX_CONNECTIONS: 120
    ports:
      - "5440:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4g
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d payment_service" ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: auth_service
      POSTGRES_MAX_CONNECTIONS: 50
    ports:
      - "5441:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d auth_service" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25
    container_name: auth-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service

  redis:
    image: redis:7
    container_name: notification_redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 4g
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10

  auth-service:
    build: ./auth-service
    expose:
      - "8081"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
    environment:
      SERVER_PORT: 8081
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: prod
      SPRING_APPLICATION_JSON: |
        {
          "server": {
            "tomcat": {
              "threads": {
                "max": 100,
                "min-spare": 20
              },
              "accept-count": 50
            }
          },
          "spring": {
            "datasource": {
              "hikari": {
                "maximum-pool-size": 5,
                "minimum-idle": 2,
                "connection-timeout": 2000
              }
            }
          }
        }
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:ActiveProcessorCount=1
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9010
        -Dcom.sun.management.jmxremote.rmi.port=9010
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=localhost
    depends_on:
      auth_postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    expose:
      - "8083"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.5"
          memory: 3g
    environment:
      SERVER_PORT: 8083
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: prod
      SPRING_APPLICATION_JSON: |
        {
          "server": {
            "tomcat": {
              "threads": {
                "max": 24,
                "min-spare": 8
              },
              "accept-count": 50
            }
          },
          "spring": {
            "datasource": {
              "hikari": {
                "maximum-pool-size": 20,
                "minimum-idle": 8,
                "connection-timeout": 3000,
                "idle-timeout": 30000,
                "max-lifetime": 600000
              }
            }
          }
        }
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:ActiveProcessorCount=2
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9011
        -Dcom.sun.management.jmxremote.rmi.port=9011
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=localhost
    depends_on:
      payment_postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8082:8082"
      - "9012:9012"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:ActiveProcessorCount=1
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9012
        -Dcom.sun.management.jmxremote.rmi.port=9012
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=localhost

volumes:
  payment_data:
  auth_data:
